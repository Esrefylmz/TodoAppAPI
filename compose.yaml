
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Password is required}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: todoapp-migrate:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      ConnectionStrings__localdb: "Server=sqlserver,1433;Database=TodoAppDocker;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Password is required};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    image: todoapp-api:dev
    ports:
      - "127.0.0.1:5059:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      ConnectionStrings__localdb: "Server=sqlserver,1433;Database=TodoAppDocker;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Password is required};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sqlserver_data:
